name: Build & Sign Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: 'never'

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew || true

      - name: Prepare Local Environment Files
        run: |
          touch .env && touch .env.example

      - name: Generate Release Keystore (Fallback)
        run: |
          if [ ! -f my-upload-key.jks ]; then
            echo "Generating release keystore my-upload-key.jks..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=TeleUCF, OU=Mobile, O=TeleUCF, L=Cienfuegos, ST=Cienfuegos, C=CU"
          else
            echo "my-upload-key.jks already exists."
          fi

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dksp.incremental=false \
            -Dksp.incremental.intermodule=false \
            --stacktrace || \
          gradle :app:assembleRelease \
            --no-daemon \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dksp.incremental=false \
            -Dksp.incremental.intermodule=false \
            --stacktrace

      - name: Verify APK Output
        run: |
          echo "Verifying generated release APK..."
          ls -lh app/build/outputs/apk/release/*.apk
          test -f app/build/outputs/apk/release/*.apk

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
